<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="initial-scale=1.0">
    <title>Gallery • Daltyn</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.google.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">

    <!-- Lab 15 | Task 1: add js -->
    <script src="script.js" defer></script>
</head>

<body>

    <!-- Lab 12 | Task 1: Current page-->
    <nav>
        <ul>
            <li>
                <a href="index.html">Home</a>
            </li>
            <li>
                <a href="projects.html">Projects</a>
            </li>
            <li>
                <a href="gallery.html" class="current">Gallery</a>
            </li>
            <!-- Class 16 | Step 1: contact link. -->
            <li>
                <a href="contact.html">Contact Me</a>
            </li>
            <!-- Lab 15 | Task 1: add the button -->
            <li>
                <button id="toggle-theme" type="button"></button>
            </li>
        </ul>
    </nav>

    <header>
        <!-- Lab 13 | Task 2: My own page-->
        <div class="content">
            <h1>Gallery</h1>
        </div>
        <label class="spritesheet_container">
            <input type="checkbox" class="pixel-art-right-toggle">
            <div class="pixel-art-right" role="img" aria-label="Animated Graphic">
                <img src="./assets/animations/default_spritesheet.png" alt="A small fellow waving."
                    class="sprite-right-only">
            </div>
        </label>
    </header>

    <main>
        <!-- Lab 14 | Task 3: cards on my page -->
        <section>

            <!-- Main Section Title -->
            <div class="align-header">
                <h2>Drawings</h2>
            </div>

            <div>
                <div class="align-header">
                    <!-- Lab 15 | Task 5: hide sections -->
                    <button type="button" class="dropdown">&gt;</button>
                    <h3>Digital</h3>
                </div>

                <!-- The cards container sits safely below the header -->
                <div class="cards">
                    <div class="card">
                        <img src="assets/art/drawings/online/swords.png"
                            alt="computer generated image of two broadswords clashing - Chroma">
                    </div>
                    <div class="card">
                        <img src="assets/art/drawings/online/foxy.png"
                            alt="computer generated image of a fluffy fox - Chroma">
                    </div>
                    <div class="card">
                        <img src="assets/art/drawings/online/header.png"
                            alt="computer generated image of a glass bust - SDXL">
                    </div>
                    <div class="card">
                        <img src="assets/art/drawings/online/bugman.png"
                            alt="computer generated image of a man made of bugs - SDXL">
                    </div>
                    <div class="card">
                        <img src="assets/art/drawings/online/coffin.png"
                            alt="computer generated image of a coffin - SDXL">
                    </div>
                    <div class="card">
                        <img src="assets/art/drawings/online/necklace.png"
                            alt="computer generated image of a necklace - SDXL">
                    </div>
                </div>
            </div>

            <div class="align-header">
                <!-- Lab 15 | Task 5: hide sections -->
                <button type="button" class="dropdown">&gt;</button>
                <h2>Photographs</h2>
            </div>

            <div class="cards">
                <!-- Lab 14 | Task 3: cards on my page -->
                <section class="card">
                    <img src="assets/art/photography/duck.png" alt="A duck">
                </section>
                <section class="card">
                    <img src="assets/art/photography/swan.png" alt="A swan">
                </section>
                <div>
                    <section class="card">
                        <img src="assets/art/photography/photo_lake.png" alt="A lake">
                    </section>
                </div>
                <section class="card">
                    <img src="assets/art/photography/stream.png" alt="A stream">
                </section>
                <section class="card">
                    <img src="assets/art/photography/flowers.png" alt="Some dead flowers">
                </section>
                <div>
                    <section class="card">

                        <img src="assets/art/photography/dynamic.png" alt="Epic skies">
                    </section>
                </div>
                <section class="card">
                    <img src="assets/art/photography/hat.png" alt="Hat on bleachers">
                </section>
                <section class="card">
                    <img src="assets/art/photography/cloud.png" alt="Clouds in the skies">
                </section>
                <section class="card">
                    <img src="assets/art/photography/rocks.png" alt="A bunch of rocks">
                </section>
            </div>
        </section>

        <div class="category-group">
            <div class="align-header">
                <!-- Lab 15 | Task 5: hide sections -->
                <button type="button" class="dropdown">&gt;</button>
                <h3>Hand</h3>
            </div>
            <div class="cards">
                <div class="card">
                    <img src="assets/art/drawings/online/workstudy.png" alt="A student studyking">
                </div>
                <p>The majority of these are silly five minute sketches, I plan to improve my drawing abilities in the future.</p>
            </div>
        </div>
    </main>

    <footer>
        <a href="https://github.com/daltyn006/" target="_blank" rel="noopener noreferrer">
            <p>&copy; <span id="year"></span> Daltyn Landas.</p>
        </a>
    </footer>
</body>

</html>
