<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

<body>

    <!-- Lab 12 | Task 1: Current page-->
    <nav>
        <ul>
            <li>
                <a href="index.html">Home</a>

                <a href="projects.html">Projects</a>
            </li>
            <li>
                <a href="gallery.html" class="current">Gallery</a>
            </li>
        </ul>
    </nav>

    <header>
        <!-- Lab 13 | Task 2: My own page-->
        <div class="content">
            <h1>Gallery</h1>
        </div>
        <label class="spritesheet_container">
            <input type="checkbox" class="pixel-art-right-toggle">
            <div class="pixel-art-right" role="img" aria-label="Animated Graphic">
                <img src="./assets/animations/default_spritesheet.png" alt="A small fellow waving."
                    class="sprite-right-only">
            </div>
        </label>
    </header>
    <main>

        <!--Lab 14 | Task 3: cards on my page-->
        <section>
            <h2>Drawings</h2>

            <div class="category-group">
                <h3>Digital</h3>
                <div class="cards">
                    <div class="card">
                        <img src="assets/art/drawings/online/workstudy.png" alt="A student">
                    </div>
                </div>
            </div>

            <div class="category-group">
                <h3>Hand</h3>
                <p>These images need to be scanned or photographed</p>
            </div>
            <h2>Photographs</h2>
            <div class="cards">
                <!--Lab 14 | Task 3: cards on my page-->
                <section class="card">
                    <img src="assets/art/photography/duck.jpg" alt="A duck">
                </section>
                <section class="card">
                    <img src="assets/art/photography/swan.jpg" alt="A swan">
                </section>
                <section class="card">
                    <img src="assets/art/photography/photo_lake.jpg" alt="A lake">
                </section>
                <section class="card">
                    <img src="assets/art/photography/stream.jpg" alt="A stream">
                </section>
                <section class="card">
                    <img src="assets/art/photography/dynamic.jpg" alt="Epic skies">
                </section>
                <section class="card">
                    <img src="assets/art/photography/flowers.jpg" alt="Some dead flowers">
                </section>
                <section class="card">
                    <img src="assets/art/photography/hat.jpg" alt="Hat on bleachers">
                </section>
                <section class="card">
                    <img src="assets/art/photography/cloud.jpg" alt="Clouds in the skies">
                </section>
                <section class="card">
                    <img src="assets/art/photography/rocks.jpg" alt="A bunch of rocks">
                </section>
            </div>

    </main>

    <footer>
        <a href="https://github.com/daltyn006/" target="_blank" rel="noopener noreferrer">
            <p>©2026 Daltyn Landas.</p>
        </a>
    </footer>

</html>
