<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery • Daltyn</title>
    <meta name="description" content="Drawings and photographs by Daltyn Landas.">
    <link rel="icon" type="image/avif" href="assets/animations/default_spritesheet.avif">

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/sprite.css">
    <link rel="stylesheet" href="css/cards.css">

    <!-- Lab 15 | Task 1: add js -->
    <script src="javascript/script.js" defer></script>
    <script src="javascript/themes.js" defer></script>
    <script src="javascript/gallery.js" defer></script>
</head>

<body>

    <!-- Lab 12 | Task 1: Current page-->
    <nav>
        <ul>
            <li>
                <a href="index.html">Home</a>
            </li>
            <li>
                <a href="projects.html">Projects</a>
            </li>
            <li>
                <a href="gallery.html" class="current">Gallery</a>
            </li>
            <!-- Class 16 | Step 1: contact link. -->
            <li>
                <a href="contact.html">Contact Me</a>
            </li>
            <li>
                <a href="interests.html">Interests</a>
            </li>
            <!-- Lab 15 | Task 1: add the button -->
            <li>
                <button id="toggle-theme" type="button"></button>
            </li>
        </ul>
    </nav>

    <header>
        <!-- Lab 13 | Task 2: My own page-->
        <div class="content">
            <h1>Gallery</h1>
        </div>
        <label class="spritesheet_container">
            <input type="checkbox" class="pixel-art-right-toggle">
            <div class="pixel-art-right" role="img" aria-label="Animated Graphic">
                <img src="./assets/animations/default_spritesheet.avif" alt="A small fellow waving."
                    class="sprite-right-only">
            </div>
        </label>
    </header>

    <main>
        <!-- Lab 14 | Task 3: cards on my page -->
        <section>

            <!-- Main Section Title -->
            <div class="align-header">
                <h3>Drawings</h3>
            </div>

            <div>
                <div class="align-header">
                    <!-- Lab 15 | Task 5: hide sections -->
                    <button type="button" class="dropdown">&gt;</button>
                    <h3>Digital</h3>
                </div>

                <!-- The cards container sits safely below the header -->
                <div class="cards" data-gallery="digital"></div>
            </div>

            <div class="align-header">
                <!-- Lab 15 | Task 5: hide sections -->
                <button type="button" class="dropdown">&gt;</button>
                <h3>Photographs</h3>
            </div>

            <div class="cards" data-gallery="photographs">
                <!-- Lab 14 | Task 3: cards on my page [ now from javascript ]-->
            </div>
        </section>

        <div class="category-group">
            <div class="align-header">
                <!-- Lab 15 | Task 5: hide sections -->
                <button type="button" class="dropdown">&gt;</button>
                <h3>Hand</h3>
                <p>
                    The majority of these are silly five minute sketches,
                    I plan to improve my drawing abilities in the future.
                </p>
            </div>
            <div class="cards" data-gallery="hand"></div>
        </div>
    </main>

    <footer>
        <a href="https://github.com/daltyn006/" target="_blank" rel="noopener noreferrer">
            <p>&copy; <span id="year"></span> Daltyn Landas.</p>
        </a>
    </footer>
</body>

</html>
