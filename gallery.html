<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery • Daltyn</title>
    <meta name="description" content="Drawings and photographs by Daltyn Landas.">
    <link rel="icon" type="image/x-icon" href="assets/other/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/other/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/other/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/other/apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="#c0c0c0">

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/sprite.css">
    <link rel="stylesheet" href="css/cards.css">

    <!-- Lab 15 | Task 1: add js. themes.js stays plain (no defer) so the
         theme is applied before the first paint. -->
    <script src="javascript/themes.js"></script>
    <script src="javascript/script.js" defer></script>
    <!-- Gallery is loaded in the body in order to allow css pre-rendering without defer -->
</head>

<body>

    <!-- Lab 12 | Task 1: Current page-->
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="gallery.html" class="current">Gallery</a></li>
            <li><a href="interests.html">Interests</a></li>
            <!-- Class 16 | Step 1: contact link. -->
            <li><a href="contact.html">Contact Me</a></li>
            <!-- Lab 15 | Task 1: theme dropdown [options created in javascript] -->
            <li class="theme-picker">
                <label for="theme-select" class="selector"></label>
                <select id="theme-select"></select>
            </li>
        </ul>
    </nav>

    <header>
        <img src="./assets/other/me.avif" alt="an image of myself" class="art-left" fetchpriority="high">
        <!-- Lab 13 | Task 2: My own page-->
        <div class="content">
            <h1>Gallery</h1>
        </div>
        <!-- The sprite window (.pixel-art-right) must have a fixed width and
             height in sprite.css so it reserves its space too. -->
        <label class="spritesheet_container">
            <input type="checkbox" class="pixel-art-right-toggle">
            <div class="pixel-art-right" role="img" aria-label="Animated Graphic">
                <img src="./assets/animations/default_spritesheet.avif" alt="A small fellow waving."
                    class="sprite-right-only">
            </div>
        </label>
    </header>

    <main>
        <!-- Lab 14 | Task 3: cards on my page -->
        <section>

            <!-- Main Section Title -->
            <div class="align-header">
                <h3>Drawings</h3>
            </div>

            <div>
                <div class="align-header">
                    <!-- Lab 15 | Task 5: hide sections -->
                    <button type="button" class="dropdown">&gt;</button>
                    <h3>Digital</h3>
                </div>
                <div class="cards" data-gallery="digital"></div>
            </div>

            <div class="align-header">
                <!-- Lab 15 | Task 5: hide sections -->
                <button type="button" class="dropdown">&gt;</button>
                <h3>Photographs</h3>
            </div>
            <div class="cards" data-gallery="photographs">
                <!-- Lab 14 | Task 3: cards [ now from javascript ]-->
            </div>
        </section>

        <div class="category-group">
            <div class="align-header">
                <!-- Lab 15 | Task 5: hide sections -->
                <button type="button" class="dropdown">&gt;</button>
                <h3>Hand</h3>
                <p>
                    The majority of these are silly five minute sketches,
                    I plan to improve my drawing abilities in the future.
                </p>
            </div>
            <div class="cards" data-gallery="hand"></div>
        </div>
    </main>

    <footer>
        <a href="https://github.com/daltyn006/" target="_blank" rel="noopener noreferrer">
            <p>&copy; <span id="year">2026</span> Daltyn Landas.</p>
        </a>
    </footer>
    <!-- Load images in the body to stop shift -->
    <script src="javascript/gallery.js"></script>
</body>

</html>
