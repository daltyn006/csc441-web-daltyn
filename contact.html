<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="initial-scale=1.0">
    <!-- Class 16 | Step 1: My contact page -->
    <title>Contact • Daltyn</title>
    <!-- Class 12 | Step 1: a typeface I choose-->
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.google.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <!-- Class 15 | Step 1: JavaScript file -->
    <script src="script.js" defer></script>
</head>

<body>
    <!-- Lab 12 | Task 1: Current page-->
    <nav>
        <ul>
            <li>
                <a href="index.html">Home</a>
            </li>
            <li>
                <a href="projects.html">Projects</a>
            </li>
            <li>
                <a href="gallery.html">Gallery</a>
            </li>
            <!-- Class 16 | Step 1: add contact page. -->
            <li>
                <a href="contact.html" class="current">Contact Me</a>
            </li>
            <li>
                <a href="interests.html">Interests</a>
            </li>
            <!-- Class 15 Step 3 the time button -->
            <li><button id="toggle-theme" type="button"></button></li>
        </ul>

    </nav>

    <!-- Class 11 | Step 2: The Page -->
    <header>
        <!--Class 12 | Step 3: an image-->
        <img src="./assets/art/photography/me.avif" alt="an image of myself" class="art-left" class="art-left">
        <!-- Lab 12 · Task 1: group the text so it stacks beside the photo -->
        <div class="content">
            <h1>Contact: Daltyn Landas</h1>
        </div>
        <label class="spritesheet_container">
            <input type="checkbox" class="pixel-art-right-toggle">
            <div class="pixel-art-right" role="img" aria-label="Animated Graphic">
                <img src="./assets/animations/default_spritesheet.avif" alt="A small fellow waving."
                    class="sprite-right-only">
            </div>
        </label>
    </header>

    <main>
        <h2> Message Me: </h2>
        <section>
            <!-- Class 16 | Step 2: a form -->
            <!-- Class 18 | Step 1: add a way for email to get sent -->
            <form id="contact-form" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field"
                action="/thanks.html">
                <p class="hidden-field">
                    <label>
                        Leave this field empty: <input name="bot-field" type="text">
                    </label>
                </p>

                <p id="form-status"></p>

                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input id="name" name="name" type="text" required placeholder="John Doe">
                </div>

                <div class="form-group">
                    <label for="email">Your Email Address</label>
                    <input id="email" name="email" type="email" required placeholder="email@address.com">
                </div>

                <div class="form-group">
                    <label for="message">Content / Message</label>
                    <textarea id="message" name="message" rows="5" required placeholder="Example message..."></textarea>
                </div>

                <button type="submit" class="submit-btn">
                    Send Email
                </button>
            </form>
    </main>
    <footer>
        <a href="https://github.com/daltyn006/" target="_blank" rel="noopener noreferrer">
            <!-- Class 15 | Step 2: The year writen by JavaScript -->
            &copy; <span id="year"></span> Daltyn Landas.
        </a>
    </footer>
</body>

</html>
