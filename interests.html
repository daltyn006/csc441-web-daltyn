    <link rel="stylesheet" href="css/sprite.css">

    <script src="javascript/script.js" defer></script>
    <!-- Class 20 | Step 2: api connection, then api page -->

<body>
    <!-- Lab 12 | Task 1: Current page-->
    <nav>
        <ul>
            <li>
                <a href="index.html">Home</a>
            </li>
            <li>
                <a href="projects.html">Projects</a>
            </li>
            <li>
                <a href="gallery.html">Gallery</a>
            </li>
            <li>
                <a href="interests.html" class="current">Interests</a>
            </li>
            <li>
                <a href="contact.html">Contact Me</a>
            </li>
            <!-- Lab 15 | Task 1: add the button [Now created in javascript]-->
            <li>
                <label for="theme-select" class="selector"></label>
                <select id="theme-select"></select>
            </li>
        </ul>
    </nav>

    <!-- Class 11 | Step 2: The Page -->
    <header>
        <!--Class 12 | Step 3: an image-->
        <img src="./assets/other/me.avif" alt="an image of myself" class="art-left" fetchpriority="high">
        <!-- Lab 12 · Task 1: group the text so it stacks beside the photo -->
        <div class="content">
            <h1>Daltyn Landas</h1>
        </div>
        <label class="spritesheet_container">
            <input type="checkbox" class="pixel-art-right-toggle">
            <div class="pixel-art-right" role="img" aria-label="Animated Graphic">
                <img src="./assets/animations/default_spritesheet.avif" alt="A small fellow waving."
                    class="sprite-right-only">
            </div>
        </label>
    </header>
    <main>
        <!-- Class 20 | Step 1: add section inside the existing main on interest html -->
        <section class="interests-section">
            <h2>My Interests</h2>
            <p>
                I enjoy drawing and creating art in my free time,
                these items come from my Supabase database.
            </p>
            <p id="showcase-status" role="status"><b>Waiting to load...</b></p>
            <p id="showcase-count"></p>
            <div id="showcase-grid" class="showcase-grid"></div>
        </section>
        <!-- Lab 20 | Task 1: ask the api again -->
        <button id="showcase-refresh" type="button">Refresh</button>
    </main>

    <footer>
        <a href="https://github.com/daltyn006/" target="_blank" rel="noopener noreferrer">

            &copy; <span id="year"></span> Daltyn Landas.

    </footer>
